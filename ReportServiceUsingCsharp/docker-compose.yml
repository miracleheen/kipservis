services:
  postgres:
    image: postgres:16
    container_name: reportservice-postgres
    environment:
      POSTGRES_DB: reportservice
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - reportservice-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresql -d reportservice"]
      interval: 2s
      timeout: 5s
      retries: 20

  liquibase:
    image: liquibase/liquibase:4.29
    container_name: reportservice-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/liquibase/changelog
    command:
      - --changelog-file=db/changelog/db.changelog-master.yaml
      - --search-path=/liquibase/changelog
      - --url=jdbc:postgresql://postgres:5432/reportservice
      - --username=postgresql
      - --password=root
      - update

volumes:
  reportservice-pgdata: